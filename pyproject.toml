[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "policy-visualizer"
version = "0.1.0"
description = "Interactive debugging views for action-chunking robot policies"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "bokeh>=3.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
policy-viz = "policy_visualizer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/policy_visualizer"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
