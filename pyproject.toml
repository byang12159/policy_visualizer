[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "policy-visualizer"
version = "0.1.0"
description = "Interactive debugging views for action-chunking robot policies"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ben Yang", email = "byang11259@gmail.com" }]
keywords = ["robotics", "action-chunking", "visualization", "imitation-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.24",
    "bokeh>=3.4",
]

[project.urls]
Homepage = "https://github.com/byang12159/policy_visualizer"
Repository = "https://github.com/byang12159/policy_visualizer"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
policy-viz = "policy_visualizer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/policy_visualizer"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
